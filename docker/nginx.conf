# Serves the Next.js static export inside the web image.
#
# The include is the whole point: every [id] route prerenders one placeholder page and depends on
# the host rewriting /dashboard/orders/<guid> onto /dashboard/orders/_.html. Those rules live in
# web/staticwebapp.config.json, which Azure Static Web Apps reads directly and nginx cannot, so the
# image generates the nginx equivalent at build time from that same file. Adding a route means
# editing the SWA config and nothing else.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Generated from web/staticwebapp.config.json during the build. Must come before the catch-all
    # below: these are "^~" prefix matches, so they win outright for the routes they name.
    include /etc/nginx/conf.d/mathilens-routes.conf;

    location / {
        # $uri.html before $uri/index.html, matching the generator's own ordering — a real page
        # such as customers/new.html has to win before an id falls through to the placeholder.
        try_files $uri $uri.html $uri/index.html =404;
    }

    # A static export has no server to ask, so an unknown path is genuinely missing rather than
    # something the app should route. Serving index.html here would answer 200 for every typo.
    error_page 404 /404.html;
}
