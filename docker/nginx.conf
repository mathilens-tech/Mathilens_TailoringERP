# The test site: static export in front, API proxied behind the same origin.
#
# Adapted from deploy/test-server/nginx-site.conf, which serves the same two things on the VM. The
# differences are all consequences of running in a container rather than on the host: TLS and the
# hostname belong to Coolify's proxy, and the API is reachable by service name instead of loopback.

# What scheme the *browser* used, which is not the scheme this server saw.
#
# Coolify's proxy terminates TLS and forwards over plain HTTP, so $scheme here is always "http".
# Passing that on would tell Kestrel the request arrived insecurely, app.UseHttpsRedirection()
# (Program.cs) would answer 307 to the https URL, the proxy would forward that back as http, and
# the two would redirect at each other for ever. deploy/test-server/README.md names this as the
# single most likely way the deployment breaks on first boot.
#
# So: prefer the header the proxy already set, and fall back to $scheme only when there is no proxy
# in front — which is how this behaves if someone runs the image directly.
map $http_x_forwarded_proto $forwarded_scheme {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    listen [::]:80;

    # No server_name: Coolify's proxy has already matched the hostname before anything reaches
    # this container, and a second copy of the name here is one more place to update at cutover.
    server_name _;

    root /var/www/mathilens;
    index index.html;

    # Location headers stay relative ("/register" rather than "https://host/register").
    #
    # nginx would otherwise build an absolute URL from $scheme, and $scheme here is always http:
    # Coolify's proxy terminates TLS and forwards in plain. So a redirect issued to an HTTPS
    # visitor named an http:// address, the browser followed it, and the proxy bounced it back to
    # https — the page arrived, after an extra round trip that left TLS in the middle. A relative
    # Location cannot be wrong about a scheme it does not mention.
    absolute_redirect off;

    # The site and the API share one origin, so no CORS preflight ever occurs on test. Production
    # splits Static Web Apps from App Service and does exercise Cors:FrontendOrigin — a divergence
    # worth knowing about, since a CORS mistake cannot surface here.
    location /api/ {
        # No URI part on proxy_pass, so the original /api/v1/... path reaches the API unchanged.
        # "api" is the compose service name; Docker's embedded DNS resolves it on the shared network.
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;

        # Spreadsheet and PDF exports are generated synchronously and can outrun the 60s default.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Hashed filenames, so they can be cached hard and forever.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Generated from web/staticwebapp.config.json at image build time — see
    # deploy/test-server/generate-nginx-routes.mjs. Every [id] route prerenders a single "_"
    # placeholder and depends on the host rewriting real ids onto it; keeping one source of truth
    # is what stops test 404ing on a page production serves.
    include /etc/nginx/mathilens-routes.conf;

    # The navigationFallback from the SWA config. $uri.html before the fallback, because a static
    # export writes /dashboard/users as dashboard/users.html rather than a directory.
    location / {
        # A trailing slash is sent to the same URL without one, before try_files ever runs.
        #
        # The export writes register.html, not register/index.html. It does create a register/
        # directory, but only for Next's own .txt metadata — there is no document in it. So
        # "/register/" matched $uri (the directory exists), found nothing to serve, and fell all
        # the way through to /index.html: the landing page, which sends anyone not signed in to
        # /login. "/register" worked and "/register/" silently became the login screen, which
        # reads as registration being disabled rather than as a URL that missed by one character.
        #
        # A redirect rather than another try_files entry, so the address bar ends up showing the
        # URL that actually works. The root is excluded by the regex needing a character before
        # the final slash, /api/ never reaches here, and the dashboard's [id] routes are matched
        # by the ^~ locations included above, which take precedence over this one.
        if ($request_uri ~ ^/(.+)/(\?.*)?$) {
            return 301 /$1$2;
        }

        try_files $uri $uri.html $uri/index.html /index.html;
    }

    # A static export has no server, so these are worth setting here.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 20m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
