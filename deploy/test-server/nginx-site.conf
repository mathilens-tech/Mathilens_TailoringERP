# The test site: static export in front, API proxied behind the same origin.
#
# certbot --nginx rewrites this file in place to add the :443 server block and the http->https
# redirect. Re-running setup.sh would overwrite that, so run certbot after setup, not before.

server {
    listen 80;
    listen [::]:80;
    server_name __SITE_HOST__;

    root /var/www/mathilens-test;
    index index.html;

    # The site and the API share one origin, so there is no CORS preflight on test at all.
    #
    # Production is split — Static Web Apps calling App Service cross-origin — so Cors:FrontendOrigin
    # is exercised there and not here. That divergence is deliberate (one host, one certificate, one
    # DNS record on a test box) but it does mean a CORS misconfiguration cannot surface in test.
    # Cors__FrontendOrigin is still set correctly in /etc/mathilens/test.env so the setting is never
    # wrong, only unexercised.
    location /api/ {
        # No URI part on proxy_pass, so the original /api/v1/... path reaches the API unchanged.
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # What stops app.UseHttpsRedirection() from looping. See mathilens-api.service.
        proxy_set_header X-Forwarded-Proto $scheme;

        # Spreadsheet and PDF exports are generated synchronously and can outrun the 60s default.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Hashed filenames, so they can be cached hard and forever.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Generated from web/staticwebapp.config.json by the deploy workflow — see
    # generate-nginx-routes.mjs. Kept as an include rather than written by hand: the rewrite rules
    # for [id] routes exist in the SWA config too, and two hand-maintained copies of the same list
    # is how test starts 404ing on a page production serves.
    include /etc/nginx/mathilens-routes.conf;

    # The navigationFallback from the SWA config. $uri.html before the fallback, because a static
    # export writes /dashboard/users as dashboard/users.html rather than a directory.
    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }

    # A static export has no server, so these are worth setting here.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 20m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
