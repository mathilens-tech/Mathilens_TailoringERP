name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dotnet:
    name: .NET build & test
    runs-on: ubuntu-latest

    # The integration tests boot the real API host, and authorization now resolves a role's
    # permissions from the database on each request so that changing what a role may do takes
    # effect immediately. Authorization runs before model validation, so every authenticated
    # request touches the database — including the ones that only assert a 400 envelope, which
    # used to fail fast without ever connecting. Postgres 18 to match production.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mathilens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore MathilensERP.slnx

      - name: Build
        run: dotnet build MathilensERP.slnx --no-restore --configuration Release

      # The API migrates on startup everywhere except Development, and the integration tests pin
      # Development precisely to stay out of that path — so booting the host does not create the
      # schema. A running Postgres alone is not enough: the authorization lookup would query a
      # table that does not exist. Apply the migrations here instead.
      #
      # ASPNETCORE_ENVIRONMENT is Development for the same reason: `dotnet ef` executes Program.cs
      # up to the point the host is built, so any other value would have it migrate twice.
      - name: Create the test schema
        run: |
          dotnet tool install --global dotnet-ef
          dotnet ef database update --project src/Infrastructure --startup-project src/Api
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__Default: "Host=localhost;Port=5432;Database=mathilens_test;Username=postgres;Password=postgres"

      - name: Test
        run: dotnet test MathilensERP.slnx --no-build --configuration Release

  web:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
