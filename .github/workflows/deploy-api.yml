name: Deploy API to Azure

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "MathilensERP.slnx"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore MathilensERP.slnx

      - name: Publish
        run: dotnet publish src/Api/MathilensERP.Api.csproj --configuration Release --no-restore --output ./publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          # The App Service that actually exists. This said api-mathilens-erp, a resource that is
          # not in the subscription — so every run of this workflow failed to find its target and
          # main deployed nowhere. Verified against `az resource list` in rg-mathilens-prod.
          app-name: mathilens-api-mrkwv
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
