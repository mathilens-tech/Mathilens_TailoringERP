name: Deploy API to Azure

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "MathilensERP.slnx"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore MathilensERP.slnx

      - name: Publish
        run: dotnet publish src/Api/MathilensERP.Api.csproj --configuration Release --no-restore --output ./publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          # This product's own App Service, in rg-radhafabric-prod.
          #
          # It has pointed at two wrong things. api-mathilens-erp was never in the subscription at
          # all, so main deployed nowhere. mathilens-api-mrkwv does exist, but it belongs to another
          # product: its settings name a Vite frontend (localhost:4173/5173) and ALLOWED_ORIGINS,
          # which this codebase never reads — it reads Cors:FrontendOrigin — and its wwwroot still
          # holds an older Mathilens.Api.dll. Deploying here stops the two products overwriting
          # each other.
          app-name: radhafabric-api
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
