name: Deploy API to Azure (test)

# The test stack's half of deploy-api.yml. Same build, different branch and different Web App:
# api-radhafabric-test, which holds its own database connection, its own JWT signing key and its
# own CORS origins, so nothing it does can reach production.
# Manual only. api-radhafabric-test is not in the subscription — `az resource list` shows no such
# Web App — so every push to dev queued a deploy that could only fail to find its target. The test
# stack now lives on mathilens-test-vm (see deploy-test.yml); this is kept, but disarmed, until
# that move is finished and one of the two is deleted.
on:
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore MathilensERP.slnx

      - name: Publish
        run: dotnet publish src/Api/MathilensERP.Api.csproj --configuration Release --no-restore --output ./publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: api-radhafabric-test
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_TEST }}
          package: ./publish
